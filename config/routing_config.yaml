# Maps each complexity tier to the model that should handle it. Change the
# provider/model_id here to repoint a tier without touching any code (or
# call PUT /v1/routing-config on the Phase 10 API, which edits this file
# for you — but strips these comments when it does, since PyYAML's dump
# doesn't preserve them; that's why they're being restored by hand here).
#
# Tier 1 -> Ollama: Phase 3, Phase 5, and Phase 9 independently found this
# is the actually-best choice (free, meets the tier's quality bar, and is
# the only provider with a consistently working key in this environment)
# — updated via the Phase 10 API as a real test of PUT /v1/routing-config,
# not just a demo. Tiers 2/3 still point at Gemini (untested live here —
# no working key yet) pending you adding GEMINI_API_KEY to .env.

routing:
  tier_1:
    provider: ollama
    model_id: llama3.2

  # Tiers 2/3 -> Groq (2026-09-30): the only cloud provider answering live
  # right now. gemini-flash-latest returned 503 UNAVAILABLE repeatedly and
  # gemini-pro-latest has zero free-tier quota (429); Groq's llama-3.x
  # models were retired, so these point at what Groq serves today.
  tier_2:
    provider: groq
    model_id: openai/gpt-oss-20b

  tier_3:
    provider: groq
    model_id: openai/gpt-oss-120b
