# Model registry: every model the router is allowed to pick from.
#
# IMPORTANT: prices below are USD per SINGLE token (not per 1M) and are my
# best approximation as of early 2026. Provider pricing pages change often —
# before you trust the dashboard's dollar figures, cross-check these against:
#   OpenAI:    https://openai.com/api/pricing
#   Anthropic: https://www.anthropic.com/pricing
#   Google:    https://ai.google.dev/gemini-api/docs/pricing
# Ollama models are always $0 since they run on your own hardware.
#
# quality_tier is a static starting guess (high/medium/low). Phase 8 (live
# benchmarking) will eventually replace this with a measured score instead
# of a hand-set label.

models:
  - provider: gemini
    model_id: gemini-2.5-pro
    cost_per_input_token: 0.00000125
    cost_per_output_token: 0.00001000
    avg_latency_ms: 1500
    quality_tier: high
    requires_api_key: true
    local: false

  - provider: gemini
    model_id: gemini-2.5-flash
    cost_per_input_token: 0.00000030
    cost_per_output_token: 0.00000250
    avg_latency_ms: 600
